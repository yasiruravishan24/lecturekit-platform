# LectureKit, everything in Docker (doc/DOCKER_DEPLOYMENT_PLAN.md). From this folder:   docker compose up -d --build
#
#   caddy  (ports 80/443)  the only part open to the internet: HTTPS certificate, upload limit, forwards to app
#   app    (not exposed)   one Python process: FastAPI server + job worker (one job at a time) + the lecturekit pipeline
#                          (Whisper, ffmpeg, Tesseract, LibreOffice) + the built web app files (once there is a web app).
#                          Its database is the SQLite file data/server.db (no separate database container).
#
# Everything that must survive a restart lives in ./data. Secrets live in .env only.
name: lecturekit

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-1}
    image: lecturekit-app
    env_file: .env
    environment:
      DATA_DIR: /data
      LK_DATA: /data/lk
      LK_CACHE: /data/cache
      LK_LOG: /data/logs
    volumes:
      - ./data:/data              # database, uploads, results, cache, logs: back this folder up
    expose:
      - "8000"                    # reachable by caddy only, never published to the internet
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-6g}   # keep below the server's RAM (for example 3g on a 4 GB server)

  caddy:
    image: caddy:2
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # the certificates: do not delete this volume
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
